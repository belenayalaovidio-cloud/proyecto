</head>

<body>

<div class="sidebar">

    <h2>🍰 SweetSys</h2>

    <ul>

        <li>
            <a href="index.html">
                <i class="fa-solid fa-house"></i> Inicio
            </a>
        </li>

        <li>
            <a href="productos.html">
                <i class="fa-solid fa-cake-candles"></i> Productos
            </a>
        </li>

        <li>
            <a href="clientes.html">
                <i class="fa-solid fa-users"></i> Clientes
            </a>
        </li>

        <li>
            <a href="ventas.html">
                <i class="fa-solid fa-cart-shopping"></i> Ventas
            </a>
        </li>

        <li>
            <a href="inventario.html">
                <i class="fa-solid fa-box"></i> Inventario
            </a>
        </li>

        <li>

            </a>

    </ul>

<div class="contenido">

    <h1>📦 Inventario</h1>
    <div class="resumen-inventario">

    <div class="resumen-card">
        <h3>📦 Total de productos</h3>
        <p id="totalProductos">0</p>
    </div>

    <div class="resumen-card">
        <h3>🟢 Disponibles</h3>
        <p id="productosDisponibles">0</p>
    </div>

    <div class="resumen-card">
        <h3>🔴 Agotados</h3>
        <p id="productosAgotados">0</p>
    </div>

</div>

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>

            </tr>

        </thead>

        <tbody id="tablaInventario">

        </tbody>

    </table>

</div>


<script src="inventario.js"></script>
