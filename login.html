<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetSys - Iniciar Sesión</title>

<link rel="stylesheet" href="login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="login">

<h1>🍰 SweetSys</h1>

<p>Sistema de Ventas para Repostería</p>

<input
type="text"
id="usuario"
placeholder="Usuario">

<input
type="password"
id="password"
placeholder="Contraseña">

<button onclick="ingresar()">

<i class="fa-solid fa-right-to-bracket"></i>

Ingresar

</button>

<p id="mensaje"></p>

</div>

<script src="login.js"></script>

</body>
</html>
